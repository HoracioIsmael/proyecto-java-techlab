version: '3.8'

services:
  # Servicio de Base de Datos (PostgreSQL)
  postgres-db:
    image: postgres:15-alpine
    container_name: techlab-postgres
    restart: always
    environment:
      POSTGRES_USER: techlab_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: techlabdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Servicio de Administración Gráfica (pgAdmin 4)
  pgadmin:
    image: dpage/pgadmin4
    container_name: techlab-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@techlab.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres-db

volumes:
  postgres_data: