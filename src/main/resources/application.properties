# ==========================================
# CONFIGURACIÓN DEL SERVIDOR
# ==========================================
server.port=8080

# ==========================================
# OPCIÓN A: POSTGRESQL (Docker) - RECOMENDADA
# ==========================================
# La URL apunta a localhost porque Docker mapea el puerto 5432 de contenedor a tu PC
spring.datasource.url=jdbc:postgresql://localhost:5432/techlabdb
spring.datasource.username=techlab_user
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración específica para Postgres
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# OPCIÓN B: H2 DATABASE (En Memoria) - ALTERNATIVA
# (Descomenta estas lineas y comenta las de arriba para usar H2)
# ==========================================
# spring.datasource.url=jdbc:h2:mem:techlabdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Habilita la consola web en http://localhost:8080/h2-console
# spring.h2.console.enabled=true

# ==========================================
# CONFIGURACIÓN COMÚN JPA / HIBERNATE
# ==========================================
# "update" crea las tablas si no existen al iniciar la app
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola (útil para depurar)
spring.jpa.show-sql=true